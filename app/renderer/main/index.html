<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deskivo - Página Inicial</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Navbar dourada com texto branco */
    .navbar {
      background-color: #bfa45f; /* dourado */
    }

    .navbar .nav-link,
    .navbar .navbar-brand {
      color: #fff;
      font-weight: 500;
    }

    .navbar .nav-link:hover {
      color: #ffd700; /* dourado brilhante no hover */
      text-decoration: underline;
    }

    /* Fundo da página branco */
    body {
      background-color: #fff;
      color: #333;
    }

    /* Conteúdo principal centralizado */
    main {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Botões/links destacados */
    .btn-gold {
      background-color: #bfa45f;
      color: #fff;
      border: none;
    }

    .btn-gold:hover {
      background-color: #ffd700;
      color: #000;
    }
  </style>
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">OS MULAMBO</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Alternar navegação">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a id="product-button" class="nav-link" href="#">Produto</a></li>
          <li class="nav-item"><a id="cliente-button" class="nav-link" href="#">Cliente</a></li>
          <li class="nav-item"><a id="usuario-button" class="nav-link" href="#">Usuário</a></li>
          <li class="nav-item"><a id="fornecedor-button" class="nav-link" href="#">Fornecedor</a></li>
          <li class="nav-item"><a id="empresa-button" class="nav-link" href="#">Empresa</a></li>
          <li class="nav-item"><a id="sale-button" class="nav-link" href="#">Venda</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Conteúdo Principal -->
  <main class="container">
    <div>
      <h1>Bem-vindo aos Mulambos</h1>
    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="home.js"></script>
</body>

</html>
